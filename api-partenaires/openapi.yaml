  /test/statements/weekly-run:
    post:
      operationId: runTestWeeklyStatements
      tags: [Mode test]
      summary: Simuler l'émission du lundi
      description: |
        Lance sur votre bac à sable l'émission que Woura fait chaque lundi en
        live : brouillons de plus de 7 jours annulés, puis un relevé émis par
        marchand fictif et par devise pour tout ce qui reste non relevé
        jusqu'à `period_end` (aujourd'hui par défaut, jamais dans le futur ;
        les jours du bac à sable sont en UTC). `statement.issued` part vers vos
        points de test pour chaque relevé émis.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestWeeklyRunRequest"
            example:
              period_end: "2026-10-18"
      responses:
        "200":
          description: Les relevés émis (sans `lines`), liste vide s'il n'y avait rien à relever.
          content:
            application/json:
              schema:
                type: object
                required: [object, results]
                properties:
                  object:
                    type: string
                    const: list
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenTestOnly"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /test/statements/{statement_id}/confirm:
    parameters:
      - $ref: "#/components/parameters/StatementId"
    post:
      operationId: confirmTestStatement
      tags: [Mode test]
      summary: Simuler la confirmation du marchand
      description: |
        Le marchand fictif confirme avoir reçu votre versement : le relevé
        (`paid`) passe `confirmed`, et `statement.confirmed` part vers vos
        points de test. Depuis un autre statut :
        `409 statement_transition_not_allowed`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
      responses:
        "200":
          description: Le relevé, confirmé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenTestOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StatementConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /test/statements/{statement_id}/dispute:
    parameters:
      - $ref: "#/components/parameters/StatementId"
    post:
      operationId: disputeTestStatement
      tags: [Mode test]
      summary: Simuler la contestation du marchand
      description: |
        Le marchand fictif conteste un relevé `issued` ou `paid` : il passe
        `disputed`, et `statement.disputed` part vers vos points de test.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestStatementDisputeRequest"
            example:
              comment: Il manque 1 000 F sur le versement.
      responses:
        "200":
          description: Le relevé, contesté.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenTestOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StatementConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

