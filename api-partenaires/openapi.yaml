        - name: event_id
          in: query
          required: false
          description: "Identifiant de l'événement, avec ou sans le préfixe `evt_`. Mal formé : `400`."
          schema:
            type: string
          example: evt_4c1f8e2a9b7d4e6f8a0c3b5d7e9f1a2c
