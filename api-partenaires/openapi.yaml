      summary: Accepter une livraison
      description: |
        Passe la livraison en `accepted`, en option avec le livreur que vous
        affectez. Permis depuis `assigned` ou `accepted` (renvoyer `accepted`
        met à jour le livreur ; sans rien de neuf, rien n'est écrit et la
        réponse est la même). La commande du marchand ne change pas.

        Une livraison arrive déjà `accepted` quand le partenariat accepte
        d'office (réglage du marchand) ; sinon elle arrive `assigned` et attend
        votre réponse. Déclarer `picked_up`, `in_transit` ou `delivered`
        (route `events`) vaut aussi acceptation.
