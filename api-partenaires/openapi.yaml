  # ══════════════════════════════════════════════════════════════════════
  # Relevés
  # ══════════════════════════════════════════════════════════════════════

  /statements:
    get:
      operationId: listStatements
      tags: [Relevés]
      summary: Lister vos relevés COD
      description: |
        Vos relevés, sans leurs lignes (`GET /statements/{id}` les donne).
        Avec une clé de test, ceux du bac à sable seulement.
      parameters:
        - name: status
          in: query
          required: false
          description: Statuts, séparés par des virgules. Un statut inconnu répond `400`.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/StatementStatus"
        - name: merchant
          in: query
          required: false
          description: "Identifiant de la boutique (UUID). Mal formé : `400`."
          schema:
            type: string
            format: uuid
        - name: currency
          in: query
          required: false
          description: Devise (code ISO 4217, insensible à la casse).
          schema:
            type: string
            example: XOF
        - name: updated_since
          in: query
          required: false
          description: "Relevés modifiés depuis cette date (ISO 8601, encodée dans l'URL). Mal formée : `400`."
          schema:
            type: string
            format: date-time
        - name: ordering
          in: query
          required: false
          description: Ordre de la liste. Toute autre valeur répond `400`.
          schema:
            type: string
            enum: [-created_at, created_at, -updated_at, updated_at]
            default: -created_at
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Une page de relevés.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedStatements"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createStatement
      tags: [Relevés]
      summary: Créer un relevé COD
      description: |
        Relève vos livraisons `delivered`, encore actives, sur aucun autre
        relevé (hors relevé annulé), de ce marchand, dans cette devise, livrées
        entre `period_start` et `period_end` (jours du marchand, bornes
        comprises). Une commande déjà sur un relevé non annulé n'y entre pas
        une seconde fois. Les montants de chaque ligne sont figés maintenant :

        `net_amount = cod_collected − delivery_fee − closing_fee`

        Le relevé est un brouillon (`draft`) que le marchand ne voit pas, sauf
        `issue: true`. 2 000 livraisons au plus.

        - `404 not_found` : boutique inconnue ou supprimée, ou avec qui vous
          n'avez ni partenariat ni livraison ;
        - `409 no_eligible_shipments` : rien à relever sur la période ;
        - `409 currency_required` : livraisons en plusieurs devises, précisez
          `currency` (liste dans `details.currencies`) ;
        - `409 too_many_shipments` : plus de 2 000 livraisons, raccourcissez
          la période ;
        - `400 validation_error` : `period_end` dans le futur, `period_start`
          après `period_end`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementCreateRequest"
            example:
              merchant_id: b4b6e0d2-5c3a-4f8e-a1d7-2c9e6f0b8a45
              currency: XOF
              period_start: "2026-10-12"
              period_end: "2026-10-18"
              issue: true
      responses:
        "201":
          description: Le relevé, avec ses lignes.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StatementCreateConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /statements/{statement_id}:
    parameters:
      - $ref: "#/components/parameters/StatementId"
    get:
      operationId: getStatement
      tags: [Relevés]
      summary: Un relevé COD, avec ses lignes
      responses:
        "200":
          description: Le relevé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /statements/{statement_id}/issue:
    parameters:
      - $ref: "#/components/parameters/StatementId"
    post:
      operationId: issueStatement
      tags: [Relevés]
      summary: Émettre un brouillon
      description: |
        Le brouillon passe `issued` : le marchand le voit dans Woura et en est
        prévenu. Corps vide. Un relevé qui n'est pas un brouillon répond
        `409 statement_transition_not_allowed`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
      responses:
        "200":
          description: Le relevé, émis.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StatementConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /statements/{statement_id}/paid:
    parameters:
      - $ref: "#/components/parameters/StatementId"
    post:
      operationId: declareStatementPayment
      tags: [Relevés]
      summary: Déclarer un versement
      description: |
        Vous avez versé au marchand : le relevé passe `paid` et le marchand
        est invité à confirmer. Possible depuis `issued`, `paid` (un versement
        en plusieurs fois) et `disputed` (un complément, une nouvelle preuve,
        après une contestation). Sans `amount`, ce qui reste dû
        (`net_amount − paid_amount`, `0` au moins) ; sans `paid_at`,
        maintenant. `paid_at` dans le futur : `400`. Net nul ou négatif
        (rien à reverser) : déclarez `paid` sans montant une fois le compte
        réglé entre vous ; le marchand est prévenu que le relevé est soldé.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementPaymentRequest"
            example:
              method: mobile_money
              paid_at: "2026-10-19T10:00:00+01:00"
              amount: 23500
              reference: MM-778899
              proof_url: https://exemple.com/recus/778899.jpg
              note: Versement de la semaine 42
      responses:
        "200":
          description: Le relevé, versement déclaré.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StatementConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /statements/{statement_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/StatementId"
    post:
      operationId: cancelStatement
      tags: [Relevés]
      summary: Annuler un relevé
      description: |
        Le relevé passe `cancelled` ; ses livraisons redeviennent libres
        (`statement_id: null`) et repartent dans votre prochain relevé.
        Possible depuis `draft`, `issued` et `disputed` — pas depuis `paid`
        (le marchand doit répondre) ni `confirmed`. `reason` est obligatoire
        sauf pour un brouillon : le marchand le lit. Les versements déclarés
        restent sur le relevé annulé.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementCancelRequest"
            example:
              reason: Commande #0419 retirée, nouveau relevé à suivre
      responses:
        "200":
          description: Le relevé, annulé.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StatementConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ══════════════════════════════════════════════════════════════════════
  # Webhooks
  # ══════════════════════════════════════════════════════════════════════

  /webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      tags: [Webhooks]
      summary: Lister vos points de webhook
      description: |
        Vos points de webhook de l'environnement de la clé (live ou test), le
        plus récent d'abord, sans leur secret. Les points supprimés n'y sont
        plus.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Une page de points.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWebhookEndpoints"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createWebhookEndpoint
      tags: [Webhooks]
      summary: Enregistrer un point de webhook
      description: |
        Enregistre une URL qui recevra les événements signés de
        l'environnement de la clé. Le `secret` de signature n'est montré
        **qu'ici** (et à `rotate-secret`) : gardez-le.

        L'URL doit être en `https`, sans identifiants, et son nom doit résoudre
        vers des adresses publiques uniquement (ni privée, ni locale, ni
        réservée) ; sinon `400 invalid_url`. La même vérification est refaite
        à chaque envoi, et aucune redirection n'est suivie.

        `events` vide ou absent : tous les événements, y compris ceux ajoutés
        plus tard. 10 points au plus par environnement (points désactivés
        compris) : au-delà, `409 too_many_endpoints`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointCreateRequest"
            example:
              url: https://api.livraisons-express.example/webhooks/woura
              description: Production Livraisons Express
              events: [shipment.assigned, shipment.updated, shipment.cancelled, shipment.status_changed]
      responses:
        "201":
          description: Le point, avec son secret.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointWithSecret"
              example:
                id: d5a1c8e3-7f2b-4c69-a0d4-3b8e6f1c9a57
                object: webhook_endpoint
                url: https://api.livraisons-express.example/webhooks/woura
                description: Production Livraisons Express
                environment: live
                events: [shipment.assigned, shipment.cancelled, shipment.status_changed, shipment.updated]
                enabled: true
                disabled_reason: ""
                consecutive_failures: 0
                created_at: "2026-10-22T08:41:37.205118+00:00"
                updated_at: "2026-10-22T08:41:37.205172+00:00"
                secret: whsec_Jx8mQ2vL5nR9tW3yB7cE1fH4kP6sU0zA2dG5jM8oQ1r
        "400":
          $ref: "#/components/responses/BadRequestWebhookUrl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/EndpointCreateConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /webhook-endpoints/{endpoint_id}:
    parameters:
      - $ref: "#/components/parameters/EndpointId"
    get:
      operationId: getWebhookEndpoint
      tags: [Webhooks]
      summary: Un point de webhook
      description: Le point, sans son secret. Un point d'un autre environnement que la clé répond `404`.
      responses:
        "200":
          description: Le point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateWebhookEndpoint
      tags: [Webhooks]
      summary: Modifier un point de webhook
      description: |
        Modifie les champs envoyés, et eux seuls (un corps qui n'est pas un
        objet JSON est refusé, `400 validation_error`). Une nouvelle `url` est
        vérifiée comme à la création (`400 invalid_url`). `enabled: true`
        réactive un point désactivé (par vous, par Woura après des échecs
        répétés, ou à la révocation de la clé qui l'a créé) et remet son
        compteur d'échecs à zéro ; `enabled: false` le
        désactive : il ne reçoit plus d'événements, et ses envois en attente
        sont abandonnés à leur prochaine tentative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointUpdateRequest"
            example:
              enabled: true
      responses:
        "200":
          description: Le point modifié, sans son secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequestWebhookUrl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteWebhookEndpoint
      tags: [Webhooks]
      summary: Supprimer un point de webhook
      description: |
        Supprime le point : il ne reçoit plus rien et disparaît des listes ;
        ses envois en attente ou en nouvel essai sont abandonnés (`failed`).
        Le journal de ses envois reste lisible dans `/webhook-deliveries`.
      responses:
        "204":
          description: Supprimé (pas de corps).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

