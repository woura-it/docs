  /test/shipments:
    post:
      operationId: createTestShipment
      tags: [Mode test]
      summary: Simuler une commande confiée
      description: |
        Un marchand fictif de votre bac à sable crée une commande et vous la
        confie : la livraison s'ouvre comme une vraie (`shipment.assigned` vers
        vos points de test), `accepted` d'office si
        `accept_automatically` vaut `true`, sinon `assigned`.

        Sans `items`, un article « Article de test » (SKU `TEST-1`, quantité
        1) au prix `cod_amount` (15 000 par défaut). Sans `customer`, le client
        prend les valeurs par défaut (« Client test », Cotonou, BJ). Le
        téléphone du client est fictif (`+99900000000`).

        Plafond : 500 commandes de test par 24 heures pour votre bac à sable ;
        au-delà, `409 sandbox_limit_reached`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestShipmentCreateRequest"
            example:
              mode: pickup
              accept_automatically: false
              items:
                - name: Pagne wax 6 yards
                  sku: PW-6
                  quantity: 2
                  unit_price: 5000
              delivery_fee: 1500
              delivery_fee_included: false
              customer:
                name: Koffi Mensah
                address: Fidjrossè, rue 12
                city: Cotonou
                country: BJ
              note: Appeler avant de passer
      responses:
        "201":
          description: La livraison de test, ouverte.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
              example:
                id: 9d2b6f80-1e4c-4a7b-8c35-f0a2e9d4b716
                object: shipment
                status: assigned
                mode: pickup
                active: true
                order_id: "604918273645102"
                order_number: "#0001"
