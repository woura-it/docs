  /webhook-endpoints/{endpoint_id}/ping:
    parameters:
      - $ref: "#/components/parameters/EndpointId"
    post:
      operationId: pingWebhookEndpoint
      tags: [Webhooks]
      summary: Tester un point (ping)
      description: |
        Envoie tout de suite un événement `ping` signé à ce point (quel que
        soit son abonnement) et rend l'envoi après la tentative : `succeeded`,
        ou `retrying` avec `response_status` et `error` (de nouveaux essais
        suivent alors, comme pour tout envoi). Corps vide.

        Un point désactivé répond `409 endpoint_disabled` : réactivez-le
        d'abord (`PATCH`, `enabled: true`).

        Limite propre à cette route : 10 requêtes par minute et par clé, en
        plus de la limite générale (`429 rate_limited`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
      responses:
        "200":
          description: L'envoi du ping, après la tentative.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
              examples:
                reussi:
                  summary: Réponse 2xx du point
                  value:
                    id: 2e7a9c41-5b8d-4f3e-a6c2-9d1b4e8f7a05
                    object: webhook_delivery
