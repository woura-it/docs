openapi: 3.1.0

info:
  title: API partenaires Woura — livraison
  version: "2026-10-22"
  description: |
    L'API des sociétés de livraison partenaires de Woura : recevoir les
    commandes que les marchands vous confient (livraisons), déclarer leurs
    statuts, répondre aux demandes de partenariat, gérer le stock en dépôt,
    tenir vos relevés COD avec les marchands et recevoir des webhooks signés.

    **Authentification.** `Authorization: Bearer wk_live_…` ou
    `Bearer wk_test_…`. Les clés sont créées par Woura ; une clé live ne
    fonctionne que pour une société vérifiée. Une clé de test agit dans un bac
    à sable propre à votre société (commandes fictives, aucun message envoyé,
    aucun stock réel déplacé) ; les routes `/test/…` lui sont réservées.

    **Format.** Corps en JSON (`Content-Type: application/json`), sinon `415`.
    Le corps doit être un objet JSON (`400 validation_error` sinon), et un
    champ inconnu est refusé (`400 validation_error`), objets imbriqués
    compris. Champs en anglais. Montants en unités de la devise : entier quand
    le montant est entier (le franc CFA n'a pas de décimales : `15000` =
    15 000 F), sinon nombre à deux décimales. Dates en ISO 8601 avec fuseau ;
    une date envoyée sans fuseau est lue en UTC (envoyez de préférence le
    fuseau).

    **Barre finale.** Chaque route répond aussi avec une barre finale
    (`/shipments/` comme `/shipments`), sans redirection.

    **Listes.** Paginées par `page` et `page_size` (20 par défaut, 100 au
    plus ; au-delà, 100) ; réponse `{count, next, previous, results}`. Une page
    au-delà de la dernière répond `404 not_found`.

    **Limites de débit.** 300 requêtes par minute et par clé, toutes routes
    confondues (la limite appliquée est rendue par `GET /me`, `rate_limit`) ;
    en plus, 30 par heure et par clé sur `POST /merchant-invitations`, et 10
    par minute et par clé sur `POST /webhook-endpoints/{id}/ping`. Au-delà :
    `429 rate_limited` avec `Retry-After` (secondes).

    **Idempotence.** L'en-tête `Idempotency-Key` (255 caractères au plus) est
    **obligatoire** sur chaque `POST` ; sans lui : `400
    idempotency_key_required`, rien n'est fait. Le même envoi avec la même clé rend la réponse du
    premier, sans rien refaire, avec l'en-tête `Idempotent-Replayed: true`. La
    même clé avec une autre méthode, un autre chemin ou un autre corps répond
    `409 idempotency_key_reused` (le chemin est comparé sans barre finale :
    `/x` et `/x/` sont la même requête). Seules les réponses 2xx sont gardées
    (une requête refusée peut être corrigée et renvoyée avec la même clé),
    pendant 7 jours. Les clés sont propres à chaque clé API. L'en-tête n'est
    lu que sur une route qui accepte `POST`.

    **Erreurs.** Toujours `{"code", "message", "details"}` : `code` est
    stable, en anglais ; `message` est lisible, en français (les messages de
    validation génériques suivent l'en-tête `Accept-Language`, français par
    défaut) ; `details` donne les erreurs par champ, à plat, avec les noms
    publics (`reason`, `items[1].quantity`, `customer.name`). Une méthode non
    prévue sur une route répond
    `405 method_not_allowed`. Une adresse inconnue sous `/api/partner/v1/`
    (identifiant qui n'est pas un UUID compris) répond `404 not_found`
    (« Route inconnue. »), sans vérifier la clé.

servers:
  - url: https://api.woura.africa/api/partner/v1
    description: Production (clés live et clés de test)

security:
  - bearerAuth: []

tags:
  - name: Société
    description: Votre société et la clé utilisée.
  - name: Marchands
    description: |
      Les marchands Woura avec lesquels votre société a un partenariat, et les
      invitations. Aucune route ne liste, ne cherche ni ne confirme un
      marchand sans partenariat. Le nom, le téléphone, le pays et l'adresse de
      ramassage d'une boutique ne sont donnés que pour un partenariat en
      attente, accepté ou suspendu ; un partenariat refusé ou résilié ne
      montre que l'identifiant de la boutique et le partenariat.
  - name: Livraisons
    description: |
      Une livraison (`shipment`) par commande confiée à votre société. Si la
      commande est réassignée, son livreur retiré ou remise en attente, votre
      livraison est close (`active: false`, et `cancelled` si elle était en
      cours) ; si la commande vous revient, une nouvelle livraison est créée.
      Ce que vous déclarez fait suivre la commande du marchand par le même
      chemin que ses propres changements de statut (messages au client, stock,
      dépenses).
  - name: Stock
    description: |
      Le stock que les marchands vous confient en dépôt (mode `depot`) :
      transferts du marchand vers votre dépôt, niveaux de stock, retours de
      votre dépôt vers le marchand.
  - name: Relevés
    description: |
      Les relevés COD : ce que vous devez reverser à un marchand pour les
      commandes livrées et encaissées à la porte. Un relevé par marchand et
      par devise ; montants figés à la création. Woura ne déplace aucun
      argent : vous déclarez votre versement, le marchand le confirme ou le
      conteste. Cycle : `draft` → `issued` → `paid` → `confirmed`, ou
      `disputed` (vous redéclarez un versement ou annulez) ; `cancelled` rend
      les livraisons, qui repartent dans le relevé suivant. Chaque lundi,
      Woura émet d'office les relevés de la semaine passée pour les sociétés
      qui ont une clé live active (`origin: automatic`), après avoir annulé
      leurs brouillons de plus de 7 jours.
  - name: Webhooks
    description: |
      Vos points de réception (`webhook_endpoint`), le journal des envois
      (`webhook_delivery`, gardé 30 jours) et les événements que Woura vous
      envoie (section `webhooks`). Les points sont propres à l'environnement
      de la clé : un point créé avec une clé de test ne reçoit que les
      événements du bac à sable, un point live que ceux du live.

      Aucun webhook ne part vers une société supprimée, désactivée, dont le
      compte est désactivé ou le compte partenaire suspendu, ni en live vers
      une société qui n'est plus vérifiée ; un envoi en attente est alors
      abandonné (`failed`).
  - name: Mode test
    description: |
      Routes réservées aux clés de test (`wk_test_…`) : elles simulent, dans
      votre bac à sable, ce qu'un marchand ferait (confier une commande,
      l'annuler, la modifier, envoyer du stock, demander un partenariat,
      répondre à un relevé) et l'émission des relevés du lundi. Avec une clé
      live : `403 test_key_required`.

paths:

  # ══════════════════════════════════════════════════════════════════════
  # Société
  # ══════════════════════════════════════════════════════════════════════

  /me:
    get:
      operationId: getCompany
      tags: [Société]
      summary: Votre société
      description: |
        La société de la clé et l'environnement de la clé. `id`, `name`,
        `verified` et `country` sont ceux de votre société, que la clé soit
        live ou de test.

        `invitation_link` : l'adresse à envoyer vous-même à vos e-commerçants
        déjà sur Woura ; le marchand l'ouvre dans l'application, voit le nom de
        votre société et accepte : le partenariat est accepté d'office. `null`
        avec une clé de test.

        `rate_limit` : la limite de débit réellement appliquée à chaque clé.
      responses:
        "200":
          description: Votre société.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
              example:
                id: 3f6b2c1e-8a47-4d2b-9c51-7e0a4b9d2f13
                object: delivery_company
                name: Livraisons Express
                environment: live
                verified: true
                country: BJ
                programs: [delivery]
                api_key:
                  prefix: wk_live_Hq3T9xLm2Pz7
                  created_at: "2026-10-20T08:30:12.402117+00:00"
                invitation_link: https://woura.africa/delivery-men/invite/q7Xk2mN9pL4vR8sT1wY6zA3bC5dE0fGh
                rate_limit: 300/min
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ══════════════════════════════════════════════════════════════════════
  # Marchands
  # ══════════════════════════════════════════════════════════════════════

  /merchants:
    get:
      operationId: listMerchants
      tags: [Marchands]
      summary: Lister vos marchands
      description: |
        Les boutiques avec lesquelles votre société a un partenariat, quel que
        soit son statut, la demande la plus récente d'abord. Avec une clé de
        test : les boutiques de votre bac à sable.
      parameters:
        - name: status
          in: query
          required: false
          description: |
            Statuts du partenariat, séparés par des virgules
            (`status=pending,accepted`). Un statut inconnu répond `400`.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PartnershipStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Une page de marchands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMerchants"
              example:
                count: 2
                next: null
                previous: null
                results:
                  - id: 0d7c4e2a-9b13-4f6e-8a25-c1e9f3b7d064
                    name: Chez Awa Couture
                    phone: "+22961000000"
                    country: BJ
                    pickup_address: ""
                    partnership:
                      id: 5a2e8c1f-7d34-4b9a-a6e0-3f8b1c5d9e27
                      status: pending
                      stock_mode: depot
                      auto_accept: true
                      message: Bonjour, pouvez-vous livrer nos commandes à Cotonou ?
                      response_message: ""
                      requested_at: "2026-10-22T10:04:51.733902+00:00"
                      responded_at: null
                      updated_at: "2026-10-22T10:04:51.733902+00:00"
                  - id: b4b6e0d2-5c3a-4f8e-a1d7-2c9e6f0b8a45
                    name: Boutique Awa
                    phone: "+22997000000"
                    country: BJ
                    pickup_address: Marché Dantokpa, allée 4, Cotonou
                    partnership:
                      id: e1c7a9f4-2b6d-4e3a-8f05-9d4c7b2a1e68
                      status: accepted
                      stock_mode: pickup
                      auto_accept: false
                      message: Invitation de Livraisons Express acceptée par le marchand.
                      response_message: ""
                      requested_at: "2026-10-20T14:22:08.115630+00:00"
                      responded_at: "2026-10-20T14:22:08.115204+00:00"
                      updated_at: "2026-10-21T07:45:19.208311+00:00"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /merchants/{shop_id}:
    parameters:
      - $ref: "#/components/parameters/ShopId"
    get:
      operationId: getMerchant
      tags: [Marchands]
      summary: Un marchand
      description: |
        Une boutique et son partenariat avec votre société. Une boutique sans
        partenariat avec vous répond `404`, comme une boutique inexistante.
      responses:
        "200":
          description: Le marchand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
              examples:
                accepte:
                  summary: Partenariat accepté
                  value:
                    id: b4b6e0d2-5c3a-4f8e-a1d7-2c9e6f0b8a45
                    name: Boutique Awa
                    phone: "+22997000000"
                    country: BJ
                    pickup_address: Marché Dantokpa, allée 4, Cotonou
                    partnership:
                      id: e1c7a9f4-2b6d-4e3a-8f05-9d4c7b2a1e68
                      status: accepted
                      stock_mode: pickup
                      auto_accept: false
                      message: Invitation de Livraisons Express acceptée par le marchand.
                      response_message: ""
                      requested_at: "2026-10-20T14:22:08.115630+00:00"
                      responded_at: "2026-10-20T14:22:08.115204+00:00"
                      updated_at: "2026-10-21T07:45:19.208311+00:00"
                refuse:
                  summary: Partenariat refusé (détails masqués)
                  value:
                    id: 0d7c4e2a-9b13-4f6e-8a25-c1e9f3b7d064
                    partnership:
                      id: 5a2e8c1f-7d34-4b9a-a6e0-3f8b1c5d9e27
                      status: refused
                      stock_mode: depot
                      auto_accept: true
                      message: ""
                      response_message: Nous ne couvrons pas encore Parakou.
                      requested_at: "2026-10-22T10:04:51.733902+00:00"
                      responded_at: "2026-10-22T10:31:02.950418+00:00"
                      updated_at: "2026-10-22T10:31:02.951077+00:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /merchants/{shop_id}/accept:
    parameters:
      - $ref: "#/components/parameters/ShopId"
    post:
      operationId: acceptMerchant
      tags: [Marchands]
      summary: Accepter une demande de partenariat
      description: |
        Accepte une demande de partenariat en attente (`pending`). `message`
        (seul champ accepté) devient la réponse au marchand
        (`partnership.response_message`).

        Refusé (`409 merchant_plan_limit`) si la boutique a atteint le nombre
        de livreurs permis par son plan. Un partenariat qui n'est pas en
        attente répond `409 partnership_not_pending`.

        L'événement `partnership.updated` part vers vos webhooks.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnershipAcceptRequest"
            example:
              message: Bienvenue chez Livraisons Express. Ramassage chaque jour à 10 h.
      responses:
        "200":
          description: Le marchand, partenariat accepté.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
              example:
                id: 0d7c4e2a-9b13-4f6e-8a25-c1e9f3b7d064
                name: Chez Awa Couture
                phone: "+22961000000"
                country: BJ
                pickup_address: ""
                partnership:
                  id: 5a2e8c1f-7d34-4b9a-a6e0-3f8b1c5d9e27
                  status: accepted
                  stock_mode: depot
                  auto_accept: true
                  message: Bonjour, pouvez-vous livrer nos commandes à Cotonou ?
                  response_message: Bienvenue chez Livraisons Express. Ramassage chaque jour à 10 h.
                  requested_at: "2026-10-22T10:04:51.733902+00:00"
                  responded_at: "2026-10-22T10:31:02.950418+00:00"
                  updated_at: "2026-10-22T10:31:02.951077+00:00"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PartnershipAcceptConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /merchants/{shop_id}/refuse:
    parameters:
      - $ref: "#/components/parameters/ShopId"
    post:
      operationId: refuseMerchant
      tags: [Marchands]
      summary: Refuser une demande de partenariat
      description: |
        Refuse une demande de partenariat en attente (`pending`). `reason`
        (seul champ accepté) devient la réponse au marchand
        (`partnership.response_message`). Une fois refusé, le partenariat ne
        montre plus que l'identifiant de la boutique.

        Un partenariat qui n'est pas en attente répond
        `409 partnership_not_pending`. L'événement `partnership.updated` part
        vers vos webhooks.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnershipRefuseRequest"
            example:
              reason: Nous ne couvrons pas encore Parakou.
      responses:
        "200":
          description: Le marchand, partenariat refusé (détails de la boutique masqués).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
              example:
                id: 0d7c4e2a-9b13-4f6e-8a25-c1e9f3b7d064
                partnership:
                  id: 5a2e8c1f-7d34-4b9a-a6e0-3f8b1c5d9e27
                  status: refused
                  stock_mode: depot
                  auto_accept: true
                  message: ""
                  response_message: Nous ne couvrons pas encore Parakou.
                  requested_at: "2026-10-22T10:04:51.733902+00:00"
                  responded_at: "2026-10-22T10:31:02.950418+00:00"
                  updated_at: "2026-10-22T10:31:02.951077+00:00"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PartnershipRefuseConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /merchant-invitations:
    post:
      operationId: createMerchantInvitation
      tags: [Marchands]
      summary: Inviter un marchand par e-mail ou téléphone
      description: |
        Invite un e-commerçant déjà sur Woura à travailler avec votre société,
        à partir de son e-mail **ou** de son téléphone (l'un des deux, pas les
        deux).

        La réponse est **toujours la même** (`202`), quel que soit le contact :
        la recherche du compte et l'envoi se font après la réponse. Vous ne
        savez pas si un compte correspond, ni s'il a été prévenu. Un marchand
        trouvé reçoit une notification (dans l'application, push et e-mail) et
        accepte ou refuse dans l'application. Rien ne part si le contact ne
        correspond à aucun marchand, si toutes ses boutiques sont déjà reliées
        à votre société, ou s'il a déjà une invitation de votre part en cours.
        Un même contact n'est invité qu'une fois par 24 heures : une nouvelle
        demande dans ce délai rend le même `id` et n'envoie rien. Une
        invitation vaut 30 jours.

        Vous n'apprenez rien avant l'acceptation ; vous recevez alors
        `merchant_invitation.accepted` et `partnership.updated`. Un refus ne
        vous est pas signalé.

        Avec une clé de test : aucune recherche, aucun envoi, même réponse.

        Limite propre à cette route : 30 requêtes par heure et par clé, en plus
        de la limite générale.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantInvitationRequest"
            examples:
              email:
                summary: Par e-mail
                value:
                  email: awa.couture@example.com
              telephone:
                summary: Par téléphone
                value:
                  phone: "+229 97 11 22 33"
      responses:
        "202":
          description: Invitation prise en compte (même réponse dans tous les cas).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantInvitation"
              example:
                id: f0a6c3e9-1b4d-4a7f-8c2e-5d9b1e3a7c40
                object: merchant_invitation
                status: accepted_for_processing
                message: Si un compte marchand Woura correspond à ce contact, il a reçu l'invitation. Vous serez prévenu s'il l'accepte.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ══════════════════════════════════════════════════════════════════════
  # Livraisons
  # ══════════════════════════════════════════════════════════════════════

  /shipments:
    get:
      operationId: listShipments
      tags: [Livraisons]
      summary: Lister vos livraisons
      description: |
        Les livraisons de votre société. Par défaut, les livraisons actives
        seulement (`active=true`), la dernière modifiée d'abord. Avec une clé de
        test : les livraisons de votre bac à sable seulement.

        Pour vous synchroniser sans webhooks, interrogez avec
        `updated_since` = la date de votre dernier passage.
      parameters:
        - name: status
          in: query
          required: false
          description: |
            Statuts, séparés par des virgules (`status=in_transit,failed`). Un
            statut inconnu répond `400`.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ShipmentStatus"
        - name: updated_since
          in: query
          required: false
          description: |
            Livraisons modifiées à cette date ou après (`updated_at` ≥ ;
            `updated_at` avance aussi quand `shipment.updated` part),
            ISO 8601. Une date illisible répond `400`.
          schema:
            type: string
            format: date-time
          example: "2026-10-22T08:00:00+00:00"
        - name: merchant
          in: query
          required: false
          description: Identifiant de la boutique (UUID). Un identifiant mal formé répond `400`.
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          required: false
          description: |
            `true` (ou `1`) : livraisons actives ; `false` (ou `0`) :
            livraisons closes ; `all` : toutes. Insensible à la casse. Toute
            autre valeur répond `400`.
          schema:
            type: string
            enum: ["true", "false", "1", "0", all]
            default: "true"
        - name: statement
          in: query
          required: false
          description: |
            `none` : les livraisons sur aucun relevé COD (avec
            `status=delivered` : ce qui reste à relever) ; ou l'identifiant
            d'un relevé : ses livraisons, closes comprises (`active` vaut
