# ════════════════════════════════════════════════════════════════════════
# Composants
# ════════════════════════════════════════════════════════════════════════

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: wk_live_… / wk_test_…
      description: |
        `Authorization: Bearer <clé>`. Une clé : `wk_live_` ou `wk_test_`,
        puis 40 caractères alphanumériques. Le secret entier n'est montré
        qu'une fois, à sa création par Woura. Le jeton de connexion des
        applications Woura n'est pas accepté ici, et la clé n'ouvre aucune
        autre route de Woura.

        - `401 invalid_api_key` : en-tête absent ou mal formé, clé inconnue
          ou révoquée (dès la révocation), compte de la société désactivé.
        - `403 company_inactive` : société désactivée par Woura.
        - `403 partner_suspended` : compte partenaire suspendu.
        - `403 company_not_verified` : clé live d'une société qui n'est plus
          vérifiée.

        Révoquer une clé désactive aussi les points de webhook créés avec elle
        (motif « Clé API qui l'a créé révoquée. ») et abandonne leurs envois
        en attente. Réactivez-les avec votre nouvelle clé du même
        environnement (`PATCH /webhook-endpoints/{id}`, `enabled: true`).

  headers:
    IdempotentReplayed:
      description: |
        `true` quand la réponse est celle d'un premier envoi avec la même
        `Idempotency-Key`, rendue sans rien refaire. Absent sinon.
      schema:
        type: string
        const: "true"
    RetryAfter:
      description: Secondes à attendre avant de réessayer.
      schema:
        type: integer
        minimum: 1
      example: 12
    WWWAuthenticate:
      description: Toujours `Bearer realm="api-partenaires"`.
      schema:
        type: string
        const: Bearer realm="api-partenaires"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Obligatoire sur tout `POST` (`400 idempotency_key_required` sinon,
        rien n'est fait). Identifiant unique de la requête (un UUID, par
        exemple), 255 caractères au plus (`400` sinon). Renvoyée avec le même corps, la
        requête rend la réponse du premier envoi sans rien refaire
        (`Idempotent-Replayed: true`) ; avec une autre méthode, un autre
        chemin (comparé sans barre finale) ou un autre corps :
        `409 idempotency_key_reused`. Seules les réponses 2xx sont gardées,
        pendant 7 jours, par clé API.
      schema:
        type: string
        maxLength: 255
      example: 3b1f6c2e-9a4d-4e7b-8c05-d2f9a1b6e384
    Page:
      name: page
      in: query
      required: false
      description: "Numéro de page, à partir de 1. Au-delà de la dernière page : `404`."
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Éléments par page. Au-delà de 100, 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ShopId:
      name: shop_id
      in: path
      required: true
      description: Identifiant de la boutique du marchand.
      schema:
        type: string
        format: uuid
      example: b4b6e0d2-5c3a-4f8e-a1d7-2c9e6f0b8a45
    ShipmentId:
      name: shipment_id
      in: path
      required: true
      description: Identifiant de la livraison.
      schema:
        type: string
        format: uuid
      example: 6f1c2a8e-3b9e-4c55-9a51-2d0f8f7b1e40
    StatementId:
      name: statement_id
      in: path
      required: true
      description: Identifiant du relevé.
      schema:
        type: string
        format: uuid
      example: 0d4e8a52-6f3b-4a1e-9c7d-2b5f8e1a9c30
    TransferId:
      name: transfer_id
      in: path
      required: true
      description: Identifiant du transfert de stock.
      schema:
        type: string
        format: uuid
      example: c2d8f1a6-4e7b-4a39-b5c0-8e1f3d6a9b27
    ReturnId:
      name: return_id
      in: path
      required: true
      description: Identifiant du retour de stock.
      schema:
        type: string
        format: uuid
      example: a9e3b7c1-6d2f-4b8a-9e40-5f7c1d3b8e62
    EndpointId:
      name: endpoint_id
      in: path
      required: true
      description: Identifiant du point de webhook.
      schema:
        type: string
        format: uuid
      example: d5a1c8e3-7f2b-4c69-a0d4-3b8e6f1c9a57
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      description: Identifiant de l'envoi de webhook.
      schema:
        type: string
        format: uuid
      example: 8b3e5d71-2c9a-4f06-b8e1-6a4d0c7f2e93
    WebhookSignature:
      name: Woura-Signature
      in: header
      required: true
      description: |
        `t=<horodatage Unix>,v1=<signature>`. `signature` = HMAC-SHA256, en
        hexadécimal, de la chaîne `"<t>.<corps brut>"`, avec le secret du
        point. Recalculée à chaque tentative (nouvel horodatage) : refusez un
        `t` trop ancien pour empêcher le rejeu d'un vieux corps, et comparez
        les signatures à temps constant. Vérifiez sur le corps brut reçu (JSON
        compact, UTF-8), pas sur un JSON réencodé.
      schema:
        type: string
        pattern: "^t=[0-9]+,v1=[0-9a-f]{64}$"
      example: t=1792660324,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
    WebhookEventType:
      name: Woura-Event
      in: header
      required: true
      description: Le type de l'événement (`type` du corps).
      schema:
        $ref: "#/components/schemas/WebhookEventTypeOrPing"
      example: shipment.assigned
    WebhookEventId:
      name: Woura-Event-Id
      in: header
      required: true
      description: |
        L'identifiant de l'événement (`id` du corps). Un même événement peut
        arriver plus d'une fois (réponse perdue, renvoi) : dédoublonnez sur
        lui.
      schema:
        type: string
        pattern: "^evt_[0-9a-f]{32}$"
      example: evt_4c1f8e2a9b7d4e6f8a0c3b5d7e9f1a2c
    WebhookDeliveryId:
      name: Woura-Delivery-Id
      in: header
      required: true
      description: |
        L'identifiant de l'envoi (`id` dans `/webhook-deliveries`). Un renvoi
        a un nouvel identifiant d'envoi ; l'événement garde le sien.
      schema:
        type: string
        format: uuid
      example: 8b3e5d71-2c9a-4f06-b8e1-6a4d0c7f2e93
    WebhookUserAgent:
      name: User-Agent
      in: header
      required: true
      schema:
        type: string
        const: Woura-Webhooks/1.0 (+https://docs.woura.africa)

  responses:
    WebhookReceived:
      description: |
        Reçu. Toute réponse 2xx en moins de 10 secondes vaut réception. Une
        autre réponse, une redirection (non suivie), un délai dépassé ou une
        panne réseau est un échec : nouvel essai (voir `WebhookDelivery`).
    BadRequest:
      description: |
        `validation_error` : champ manquant, mal formé ou inconnu (`details`
        par champ, ou `non_field_errors`), paramètre de requête invalide, corps
        JSON illisible ou qui n'est pas un objet, `Idempotency-Key` de plus de
        255 caractères, ou refus d'une règle métier (statut, motif, date,
        stock).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            champ_inconnu:
              summary: Champ inconnu et champ manquant
              value:
                code: validation_error
                message: Ce champ est obligatoire. Champ inconnu.
                details:
                  status: [Ce champ est obligatoire.]
                  staus: [Champ inconnu.]
            motif:
              summary: Motif obligatoire pour ce statut
              value:
                code: validation_error
                message: Le motif est obligatoire pour ce statut.
                details:
                  reason: [Le motif est obligatoire pour ce statut.]
            imbrique:
              summary: Erreurs dans des objets imbriqués
              value:
                code: validation_error
                message: Assurez-vous que cette valeur est supérieure ou égale à 1. Champ inconnu.
                details:
                  items[1].quantity: [Assurez-vous que cette valeur est supérieure ou égale à 1.]
                  customer.nom: [Champ inconnu.]
            corps:
              summary: Corps qui n'est pas un objet JSON
              value:
                code: validation_error
                message: Le corps doit être un objet JSON.
                details: {}
            filtre:
              summary: Paramètre de requête invalide
              value:
                code: validation_error
                message: "Statut inconnu : shipped."
                details: {}
    BadRequestWebhookUrl:
      description: |
        `validation_error` (champ manquant, mal formé ou inconnu ; événement
        inconnu dans `events`) ou `invalid_url` : URL refusée (pas `https`,
        identifiants dans l'URL, nom introuvable ou trop lent à résoudre,
        adresse non publique, plus de 500 caractères, port invalide).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            url:
              summary: URL refusée
              value:
                code: invalid_url
                message: Seules les URL https sont acceptées.
                details:
                  url: [Seules les URL https sont acceptées.]
            prive:
              summary: Adresse non publique
              value:
                code: invalid_url
                message: Cette adresse n'est pas publique.
                details:
                  url: [Cette adresse n'est pas publique.]
    Unauthorized:
      description: |
        `invalid_api_key` : en-tête `Authorization` absent ou mal formé, clé
        inconnue ou révoquée, compte de la société désactivé.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_api_key
            message: Clé API inconnue ou révoquée.
            details: {}
    Forbidden:
      description: |
        `company_inactive` (société désactivée par Woura),
        `partner_suspended` (compte partenaire suspendu) ou
        `company_not_verified` (clé live d'une société qui n'est plus
        vérifiée).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: company_not_verified
            message: Les clés live ne fonctionnent que pour une entreprise vérifiée par Woura.
            details: {}
    ForbiddenTestOnly:
      description: |
        `test_key_required` : route réservée aux clés de test. Ou, comme
        partout, `company_inactive`, `partner_suspended`,
        `company_not_verified`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: test_key_required
            message: Route réservée aux clés de test (wk_test_…).
            details: {}
    NotFound:
      description: |
        `not_found` : ressource inexistante, ou qui n'est pas à votre société
        (ou pas à l'environnement de la clé), ou page au-delà de la dernière.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: Livraison introuvable.
            details: {}
    UnsupportedMediaType:
      description: "`unsupported_media_type` : corps envoyé avec un autre type que `application/json`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unsupported_media_type
            message: "Envoyez du JSON (Content-Type: application/json)."
            details: {}
    RateLimited:
      description: |
        `rate_limited` : 300 requêtes par minute et par clé dépassées (ou 30
        par heure sur `POST /merchant-invitations`, ou 10 par minute sur
        `POST /webhook-endpoints/{id}/ping`).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: rate_limited
            message: Trop de requêtes. Réessayez plus tard.
            details: {}
    InternalError:
      description: "`internal_error` : erreur inattendue chez Woura. Réessayez ; si elle persiste, contactez Woura."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
            message: Erreur interne. Réessayez ; si elle persiste, contactez Woura.
            details: {}
    SandboxLimitConflict:
      description: |
        `sandbox_limit_reached` : plafond du bac à sable atteint (500 commandes
        de test ou 200 transferts de test par 24 heures, 20 marchands fictifs
        en tout) ; `idempotency_key_reused`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: sandbox_limit_reached
            message: "Bac à sable : 500 commandes de test par 24 h au plus."
            details: {}
    IdempotencyConflict:
      description: "`idempotency_key_reused` : cette `Idempotency-Key` a déjà servi pour une autre requête."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: idempotency_key_reused
            message: Cette clé d'idempotence a déjà servi pour une autre requête.
            details: {}
    ShipmentConflict:
      description: |
        - `transition_not_allowed` : passage non permis depuis le statut actuel ;
        - `shipment_closed` : livraison close (commande réassignée, refusée ou
          remise en attente) ;
        - `idempotency_key_reused` : même `Idempotency-Key`, autre contenu ;
        - `conflict` : refus d'un service de Woura (stock de votre dépôt
          refusé à la livraison, par exemple).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            transition:
              summary: Passage non permis
              value:
                code: transition_not_allowed
                message: Passage de delivered à in_transit non permis.
                details: {}
            close:
              summary: Livraison close
              value:
                code: shipment_closed
                message: "Cette livraison est close : la commande a été réassignée, refusée ou remise en attente."
                details: {}
    TestShipmentConflict:
      description: |
        `shipment_closed` : livraison close (ou, pour `cancel`, déjà
        terminée) ; `idempotency_key_reused`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: shipment_closed
            message: Cette livraison est déjà terminée ou close.
            details: {}
    PartnershipAcceptConflict:
      description: |
        `partnership_not_pending` (le partenariat n'est pas en attente),
        `merchant_plan_limit` (la boutique a atteint le nombre de livreurs
        permis par son plan), `idempotency_key_reused`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            pas_en_attente:
              summary: Pas en attente
              value:
                code: partnership_not_pending
                message: Seule une demande en attente peut être acceptée.
                details: {}
            plan:
              summary: Limite du plan du marchand
              value:
                code: merchant_plan_limit
                message: Cette boutique a atteint le nombre de livreurs permis par son plan.
                details: {}
    PartnershipRefuseConflict:
      description: "`partnership_not_pending` (le partenariat n'est pas en attente), `idempotency_key_reused`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: partnership_not_pending
            message: Seule une demande en attente peut être refusée.
            details: {}
    TransferConflict:
      description: "`transfer_not_pending` (le transfert n'est pas en attente), `idempotency_key_reused`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: transfer_not_pending
            message: Seul un transfert en attente peut être accepté.
            details: {}
    StockReturnConflict:
      description: |
        `conflict` : produit absent de votre stock, ou quantité supérieure à
        votre stock ; `idempotency_key_reused`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: conflict
            message: "Stock insuffisant. Disponible: 4, demandé: 9"
            details: {}
    StatementCreateConflict:
      description: |
        `no_eligible_shipments` (rien à relever), `currency_required`
        (plusieurs devises : `details.currencies`), `too_many_shipments`
        (plus de 2 000 livraisons), `idempotency_key_reused`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: currency_required
            message: "Livraisons en plusieurs devises : un relevé par devise, précisez `currency`."
            details:
              currencies: [GHS, XOF]
    StatementConflict:
      description: "`statement_transition_not_allowed` (geste impossible dans le statut actuel), `idempotency_key_reused`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: statement_transition_not_allowed
            message: Impossible d'annuler un relevé au statut « Versement déclaré ».
            details: {}
    EndpointCreateConflict:
      description: "`too_many_endpoints` (10 points au plus par environnement), `idempotency_key_reused`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: too_many_endpoints
            message: 10 points de webhook au plus par environnement.
            details: {}
    EndpointDisabledConflict:
      description: "`endpoint_disabled` : le point est désactivé (ou supprimé) ; `idempotency_key_reused`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: endpoint_disabled
            message: "Ce point est désactivé : réactivez-le (enabled: true) avant de le tester."
            details: {}

  schemas:

    # ── Erreur et pagination ────────────────────────────────────────────

    Error:
      type: object
      description: Le format de toute erreur de l'API.
      required: [code, message, details]
      properties:
        code:
          type: string
          description: |
            Code stable, à utiliser dans votre code :

            | HTTP | `code` |
            |---|---|
            | 400 | `validation_error`, `invalid_url` |
            | 401 | `invalid_api_key` |
            | 403 | `company_inactive`, `partner_suspended`, `company_not_verified`, `test_key_required`, `forbidden` |
            | 404 | `not_found` |
            | 405 | `method_not_allowed` |
            | 409 | `transition_not_allowed`, `shipment_closed`, `idempotency_key_reused`, `conflict`, `merchant_plan_limit`, `partnership_not_pending`, `transfer_not_pending`, `too_many_endpoints`, `endpoint_disabled`, `sandbox_limit_reached`, `no_eligible_shipments`, `currency_required`, `too_many_shipments`, `statement_transition_not_allowed` |
            | 415 | `unsupported_media_type` |
            | 429 | `rate_limited` |
            | 500 | `internal_error` |

            `forbidden` : un refus d'accès venu d'un service de Woura, sans
            code plus précis. `error` : toute autre erreur HTTP de moins de
            500 sans code plus précis (le statut HTTP fait foi).
          enum:
            - validation_error
            - invalid_url
            - invalid_api_key
            - forbidden
            - company_inactive
            - partner_suspended
            - company_not_verified
            - test_key_required
            - not_found
            - method_not_allowed
            - transition_not_allowed
            - shipment_closed
            - idempotency_key_reused
            - conflict
            - merchant_plan_limit
            - partnership_not_pending
            - transfer_not_pending
            - too_many_endpoints
            - endpoint_disabled
            - sandbox_limit_reached
            - no_eligible_shipments
            - currency_required
            - too_many_shipments
            - statement_transition_not_allowed
            - unsupported_media_type
            - rate_limited
            - internal_error
            - error
        message:
          type: string
          description: Message lisible, en français (messages de validation génériques selon `Accept-Language`).
        details:
          type: object
          description: |
            Erreurs par champ, à plat, chacune une liste de messages. Clés :
            noms publics des champs, indices entre crochets et sous-champs
            après un point pour les objets imbriqués (`items[1].quantity`,
            `customer.name`), ou `non_field_errors`. Objet vide sinon.
            Exceptions : `currency_required` y met `currencies` (liste des
            devises), `too_many_shipments` y met `shipments` et `max`.
          additionalProperties: true

    Pagination:
      type: object
      required: [count, next, previous]
      properties:
        count:
          type: integer
          description: Nombre total d'éléments, toutes pages confondues.
        next:
          type: [string, "null"]
          format: uri
          description: Adresse de la page suivante, `null` sur la dernière.
        previous:
          type: [string, "null"]
          format: uri
          description: Adresse de la page précédente, `null` sur la première.

    PaginatedMerchants:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/Merchant"
    PaginatedShipments:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/Shipment"
    PaginatedStockLevels:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/StockLevel"
    PaginatedStockTransfers:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/StockTransfer"
    PaginatedStockReturns:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/StockReturn"
    PaginatedStatements:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [results]
          properties:
            results:
              type: array
              description: Les relevés, sans `lines`.
              items:
                $ref: "#/components/schemas/Statement"
    PaginatedWebhookEndpoints:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/WebhookEndpoint"
    PaginatedWebhookDeliveries:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/WebhookDelivery"

    # ── Valeurs ─────────────────────────────────────────────────────────

    Amount:
      type: number
      description: |
        Montant en unités de la devise : entier quand il l'est (le franc CFA
        n'a pas de décimales), sinon deux décimales.
      example: 15000
    DateTime:
      type: string
      format: date-time
      description: Date ISO 8601 avec fuseau.
      example: "2026-10-22T09:12:03.418225+00:00"
    NullableDateTime:
      type: [string, "null"]
      format: date-time
      description: Date ISO 8601 avec fuseau, ou `null`.
    Environment:
      type: string
      enum: [live, test]
      description: "`live` ou `test`, selon la clé."
    ShipmentStatus:
      type: string
      description: |
        - `assigned` : confiée à votre société, en attente de votre réponse ;
        - `accepted` : acceptée (par vous, ou d'office) ;
        - `refused` : refusée par vous (finale, livraison close) ;
        - `picked_up` : colis ramassé chez le marchand (mode `pickup`) ;
        - `in_transit` : en route vers le client ;
        - `delivered` : livrée (finale) ;
        - `failed` : tentative échouée ;
        - `rescheduled` : reportée à `rescheduled_for` ;
        - `returned` : retournée au marchand (finale) ;
        - `cancelled` : annulée (finale).
      enum: [assigned, accepted, refused, picked_up, in_transit, delivered, failed, rescheduled, returned, cancelled]
    DeclarableShipmentStatus:
      type: string
      description: Les statuts que vous pouvez déclarer (tous sauf `assigned`).
      enum: [accepted, refused, picked_up, in_transit, delivered, failed, rescheduled, returned, cancelled]
    StockMode:
      type: string
      description: |
        `depot` : vous détenez le stock du marchand (transferts) ; il est
        contrôlé quand le colis part en livraison. `pickup` : vous passez
        prendre le colis chez le marchand, à `pickup_address`.
      enum: [depot, pickup]
    PartnershipStatus:
      type: string
      enum: [pending, accepted, refused, suspended, terminated]
    StockTransferStatus:
      type: string
      enum: [pending, accepted, refused, cancelled]
    StockReturnStatus:
      type: string
      enum: [pending, accepted, refused]
    WebhookDeliveryStatus:
      type: string
      description: |
        - `pending` : pas encore tenté ;
        - `retrying` : échec, nouvel essai prévu (`next_attempt_at`) ;
        - `succeeded` : réponse 2xx reçue ;
        - `failed` : abandonné (tentatives épuisées, point désactivé ou
          supprimé, société qui ne peut plus rien recevoir).
      enum: [pending, retrying, succeeded, failed]
    EventType:
      type: string
      description: Les événements auxquels un point peut s'abonner.
      enum:
        - shipment.assigned
        - shipment.updated
        - shipment.cancelled
        - shipment.status_changed
        - partnership.requested
        - partnership.updated
        - merchant_invitation.accepted
        - stock_transfer.requested
        - stock_transfer.updated
        - stock_return.created
        - stock_return.updated
        - statement.issued
        - statement.confirmed
        - statement.disputed
        - statement.cancelled
    WebhookEventTypeOrPing:
      type: string
      description: Tous les types d'événements, `ping` compris.
      enum:
        - shipment.assigned
        - shipment.updated
        - shipment.cancelled
        - shipment.status_changed
        - partnership.requested
        - partnership.updated
        - merchant_invitation.accepted
        - stock_transfer.requested
        - stock_transfer.updated
        - stock_return.created
        - stock_return.updated
        - statement.issued
        - statement.confirmed
        - statement.disputed
        - statement.cancelled
        - ping

    # ── Société ─────────────────────────────────────────────────────────

    Company:
      type: object
      required: [id, object, name, environment, verified, country, programs, api_key, invitation_link, rate_limit]
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: delivery_company
        name:
          type: string
        environment:
          $ref: "#/components/schemas/Environment"
        verified:
          type: boolean
          description: Société vérifiée par Woura (condition des clés live).
        country:
          type: string
          description: Code pays de la société, chaîne vide s'il n'est pas renseigné.
        programs:
          type: array
          items:
            type: string
            const: delivery
        api_key:
          type: object
          required: [prefix, created_at]
          properties:
            prefix:
              type: string
              description: Le début visible de la clé utilisée (`wk_live_` ou `wk_test_` et 12 caractères).
            created_at:
              $ref: "#/components/schemas/DateTime"
        invitation_link:
          type: [string, "null"]
          format: uri
          description: Votre lien d'invitation pour les marchands ; `null` avec une clé de test.
        rate_limit:
          type: string
          description: Limite de débit réellement appliquée à chaque clé (toutes routes).
          example: 300/min

    # ── Marchands ───────────────────────────────────────────────────────

    MerchantSummary:
      type: object
      description: |
        Une boutique. `name`, `phone`, `country` et `pickup_address` ne sont
        présents que pour un partenariat en attente, accepté ou suspendu (ou
        sans partenariat, dans une livraison) ; un partenariat refusé ou
        résilié ne montre que `id`.
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          description: Numéro WhatsApp de la boutique, sinon son téléphone, sinon celui du marchand ; chaîne vide à défaut.
        country:
          type: string
          description: Code pays de la boutique, chaîne vide à défaut.
        pickup_address:
          type: string
          description: Adresse de ramassage fixée dans le partenariat, chaîne vide à défaut.
    Merchant:
      description: Une boutique et son partenariat avec votre société.
      allOf:
        - $ref: "#/components/schemas/MerchantSummary"
        - type: object
          required: [partnership]
          properties:
            partnership:
              $ref: "#/components/schemas/Partnership"
    Partnership:
      type: object
      required: [id, status, stock_mode, auto_accept, message, response_message, requested_at, responded_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/PartnershipStatus"
        stock_mode:
          $ref: "#/components/schemas/StockMode"
        auto_accept:
          type: boolean
          description: Les livraisons de ce marchand arrivent déjà `accepted` (réglage du marchand).
        message:
          type: string
          description: Message de la demande ; chaîne vide pour un partenariat refusé ou résilié.
        response_message:
          type: string
          description: Votre réponse à la demande.
        requested_at:
          $ref: "#/components/schemas/DateTime"
        responded_at:
          $ref: "#/components/schemas/NullableDateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"
    MerchantRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    MerchantInvitation:
      type: object
      required: [id, object, status, message]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Identifiant de l'invitation ; il revient dans
            `merchant_invitation.accepted` (`data.invitation.id`) si le
            marchand accepte.
        object:
          type: string
          const: merchant_invitation
        status:
          type: string
          const: accepted_for_processing
        message:
          type: string

    # ── Livraisons ──────────────────────────────────────────────────────

    Shipment:
      type: object
      description: |
        Une livraison : la commande qu'un marchand confie à votre société. La
        même forme dans les réponses de l'API et dans les webhooks.
      required:
        - id
        - object
        - status
        - mode
        - active
        - order_id
        - order_number
        - merchant
        - customer
        - items
        - cod_amount
        - delivery_fee
        - delivery_fee_included
        - currency
        - payment
        - note
        - external_reference
        - rider
        - reason
        - photo_url
        - rescheduled_for
        - statement_id
        - created_at
        - updated_at
        - closed_at
        - events
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: shipment
        status:
          $ref: "#/components/schemas/ShipmentStatus"
        mode:
          $ref: "#/components/schemas/StockMode"
        active:
          type: boolean
          description: |
            `false` quand la livraison est close : refusée par vous, commande
            réassignée, livreur retiré, commande remise en attente, ou reprise
            après un statut final. Une livraison close n'évolue plus : ce qui
            vient de la commande (`order_number`, `merchant`, `customer`,
            `items`, `cod_amount`, `delivery_fee`, `delivery_fee_included`,
            `currency`, `payment`, `note`…) est figé à la clôture, au dernier
            contenu que Woura vous a publié, et ne suit plus les retouches du
            marchand. À défaut de contenu publié, la commande actuelle, avec un
            client vide.
        order_id:
          type: string
          description: Identifiant de la commande chez Woura.
        order_number:
          type: string
          description: Numéro de commande affiché au marchand, chaîne vide à défaut.
        merchant:
          oneOf:
            - $ref: "#/components/schemas/MerchantSummary"
            - type: "null"
        customer:
          $ref: "#/components/schemas/Customer"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShipmentItem"
        cod_amount:
          $ref: "#/components/schemas/Amount"
          description: |
            Ce que votre livreur encaisse auprès du client : les articles
            (moins ce que le client a déjà payé en ligne), plus les frais de
            livraison quand ils ne sont pas inclus. Suit les retouches du
            marchand tant que la livraison est active ; figé à sa clôture (le
            montant enregistré sur la livraison).
        delivery_fee:
          $ref: "#/components/schemas/Amount"
          description: Les frais de livraison de la commande (ou vos frais réels déclarés avec `delivered`). Figés à la clôture.
        delivery_fee_included:
          type: boolean
          description: |
            `true` : la course est à la charge du marchand. `false` : le
            client la paie en plus, elle est comprise dans `cod_amount`.
        currency:
          type: string
          description: Devise (code ISO 4217).
          example: XOF
        payment:
          $ref: "#/components/schemas/ShipmentPayment"
        note:
          type: string
          description: Note de la commande.
        external_reference:
          type: string
          description: Votre référence (`PATCH /shipments/{id}` ou `events`).
        rider:
          type: object
          required: [name, phone]
          description: Le livreur que vous avez affecté (chaînes vides à défaut).
          properties:
            name:
              type: string
            phone:
              type: string
        reason:
          type: string
          description: Motif du dernier statut (refus, échec, report, annulation), chaîne vide sinon.
        photo_url:
          type: string
          description: Dernière photo transmise (preuve de livraison, par exemple), chaîne vide à défaut.
        rescheduled_for:
          $ref: "#/components/schemas/NullableDateTime"
          description: Date de report quand `status` vaut `rescheduled`, `null` pour tout autre statut.
        statement_id:
          type: [string, "null"]
          format: uuid
          description: Le relevé COD qui solde cette livraison, `null` tant qu'elle n'est sur aucun relevé (ou si le sien a été annulé).
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"
          description: Dernière modification de la livraison, y compris un changement de contenu signalé par `shipment.updated`.
        closed_at:
          $ref: "#/components/schemas/NullableDateTime"
          description: "Date de clôture (`active: false`), `null` tant que la livraison est active."
        events:
          type: array
          description: Le journal complet, du plus ancien au plus récent.
          items:
            $ref: "#/components/schemas/ShipmentEvent"
    Customer:
      type: object
      required: [name, phone, address, city, country, details]
      description: Le client final (chaînes vides à défaut).
      properties:
        name:
          type: string
        phone:
          type: string
        address:
          type: string
          description: Adresse de livraison (lignes 1 et 2).
        city:
          type: string
        country:
          type: string
        details:
          type: string
          description: Précisions sur l'adresse (repères).
    ShipmentItem:
      type: object
      required: [name, variant, sku, quantity, unit_price, product_id]
      properties:
        name:
          type: string
        variant:
          type: string
        sku:
          type: string
        quantity:
          type: integer
        unit_price:
          $ref: "#/components/schemas/Amount"
        product_id:
          type: [string, "null"]
          description: Identifiant du produit chez Woura (celui de `/stock`), `null` pour un article sans produit.
    ShipmentPayment:
      type: object
      required: [status, paid_amount]
      description: Ce que le client a déjà payé en ligne.
      properties:
        status:
          type: string
          enum: [unpaid, partially_paid, paid]
          description: "`partially_paid` : un acompte ; `paid` : payé en entier."
        paid_amount:
          $ref: "#/components/schemas/Amount"
    ShipmentEvent:
      type: object
      description: Une ligne du journal de la livraison.
      required: [status, previous_status, reason, actor, occurred_at, recorded_at]
      properties:
        status:
          $ref: "#/components/schemas/ShipmentStatus"
        previous_status:
          type: string
          description: Statut d'avant, chaîne vide pour la première ligne.
          enum: ["", assigned, accepted, refused, picked_up, in_transit, delivered, failed, rescheduled, returned, cancelled]
        reason:
          type: string
        actor:
          type: string
          description: |
            Qui a fait le changement : `merchant`, `delivery_company` (votre
            société, par l'application Woura Agent), `api` (votre société, par
            l'API), `call_center`, `woura_staff`, `system`.
          enum: [merchant, delivery_company, api, call_center, woura_staff, system]
        occurred_at:
          $ref: "#/components/schemas/DateTime"
          description: Quand c'est arrivé (`occurred_at` déclaré, sinon l'heure d'écriture).
        recorded_at:
          $ref: "#/components/schemas/DateTime"
          description: Quand Woura l'a écrit.

    # ── Relevés ─────────────────────────────────────────────────────────

    StatementStatus:
      type: string
      description: |
        - `draft` : créé par vous, invisible du marchand ;
        - `issued` : émis, le marchand le voit ;
        - `paid` : versement déclaré, réponse du marchand attendue ;
        - `confirmed` : le marchand a reçu l'argent (final) ;
        - `disputed` : contesté par le marchand ;
        - `cancelled` : annulé, ses livraisons sont de nouveau libres (final).
      enum: [draft, issued, paid, confirmed, disputed, cancelled]
    PaymentMethod:
      type: string
      enum: [mobile_money, bank_transfer, cash, other]
    Statement:
      type: object
      description: |
        Un relevé COD entre votre société et un marchand, dans une devise.
        `lines` n'est présent que dans `GET /statements/{id}` et les réponses
        des `POST` (ni dans la liste, ni dans les webhooks).
      required:
        - id
        - object
        - status
        - origin
        - merchant
        - currency
        - period_start
        - period_end
        - shipment_count
        - cod_total
        - delivery_fee_total
        - closing_fee_total
        - net_amount
        - paid_amount
        - payments
        - dispute_comment
        - cancellation_reason
        - issued_at
        - payment_declared_at
        - confirmed_at
        - disputed_at
        - cancelled_at
        - created_at
        - updated_at
        - events
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: statement
        status:
          $ref: "#/components/schemas/StatementStatus"
        origin:
          type: string
          description: "`delivery_company` : créé par vous ; `automatic` : émis par Woura le lundi."
          enum: [delivery_company, automatic]
        merchant:
          $ref: "#/components/schemas/MerchantSummary"
        currency:
          type: string
          description: Devise (code ISO 4217) des commandes du relevé.
          example: XOF
        period_start:
          type: string
          format: date
          description: Premier jour couvert (jour du marchand).
        period_end:
          type: string
          format: date
          description: Dernier jour couvert (jour du marchand), compris.
        shipment_count:
          type: integer
        cod_total:
          $ref: "#/components/schemas/Amount"
          description: Encaissé à la porte, somme des `cod_collected`.
        delivery_fee_total:
          $ref: "#/components/schemas/Amount"
          description: Vos frais de livraison, que vous gardez.
        closing_fee_total:
          $ref: "#/components/schemas/Amount"
          description: Vos frais de confirmation (closing), que vous gardez ; `0` pour une commande confirmée par un call center.
        net_amount:
          $ref: "#/components/schemas/Amount"
          description: "Dû au marchand : `cod_total − delivery_fee_total − closing_fee_total`. Négatif : le marchand vous doit vos frais."
        paid_amount:
          $ref: "#/components/schemas/Amount"
          description: Somme de vos versements déclarés.
        payments:
          type: array
          items:
            $ref: "#/components/schemas/StatementPayment"
        dispute_comment:
          type: string
          description: Le commentaire de la dernière contestation du marchand, chaîne vide sinon.
        cancellation_reason:
          type: string
        issued_at:
          $ref: "#/components/schemas/NullableDateTime"
        payment_declared_at:
          $ref: "#/components/schemas/NullableDateTime"
          description: Votre dernière déclaration de versement.
        confirmed_at:
          $ref: "#/components/schemas/NullableDateTime"
        disputed_at:
          $ref: "#/components/schemas/NullableDateTime"
          description: La dernière contestation.
        cancelled_at:
          $ref: "#/components/schemas/NullableDateTime"
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"
        events:
          type: array
          description: Le journal, du plus ancien au plus récent.
          items:
            $ref: "#/components/schemas/StatementEvent"
        lines:
          type: array
          description: Une ligne par livraison, montants figés à la création du relevé.
          items:
            $ref: "#/components/schemas/StatementLine"
    StatementLine:
      type: object
      required: [shipment_id, order_id, order_number, delivered_at, cod_collected, delivery_fee, closing_fee, net_amount]
      properties:
        shipment_id:
          type: [string, "null"]
          format: uuid
        order_id:
          type: [string, "null"]
        order_number:
          type: string
        delivered_at:
          $ref: "#/components/schemas/DateTime"
          description: Le `occurred_at` de votre `delivered`, jamais après la réception de l'événement par Woura (ou l'heure où la commande a été livrée côté Woura).
        cod_collected:
          $ref: "#/components/schemas/Amount"
        delivery_fee:
          $ref: "#/components/schemas/Amount"
        closing_fee:
          $ref: "#/components/schemas/Amount"
        net_amount:
          $ref: "#/components/schemas/Amount"
    StatementPayment:
      type: object
      required: [id, amount, paid_at, method, reference, proof_url, note, declared_at]
      properties:
        id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Amount"
        paid_at:
          $ref: "#/components/schemas/DateTime"
        method:
          $ref: "#/components/schemas/PaymentMethod"
        reference:
          type: string
        proof_url:
          type: string
        note:
          type: string
        declared_at:
          $ref: "#/components/schemas/DateTime"
    StatementEvent:
      type: object
      required: [status, previous_status, actor, comment, occurred_at]
      properties:
        status:
          $ref: "#/components/schemas/StatementStatus"
        previous_status:
          type: string
          enum: ["", draft, issued, paid, confirmed, disputed, cancelled]
        actor:
          type: string
          description: "`api` : vous ; `merchant` ; `woura_staff` ; `system` : l'émission du lundi."
          enum: [merchant, delivery_company, api, call_center, woura_staff, system]
        comment:
          type: string
          description: Contestation, motif d'annulation ou note du versement.
        occurred_at:
          $ref: "#/components/schemas/DateTime"

    # ── Stock ───────────────────────────────────────────────────────────

    Product:
      type: object
      required: [id, name, sku]
      properties:
        id:
          type: string
          description: Identifiant du produit chez Woura.
        name:
          type: string
        sku:
          type: string
    StockLevel:
      type: object
      required: [merchant, product, quantity, reorder_threshold, updated_at]
      properties:
        merchant:
          oneOf:
            - $ref: "#/components/schemas/MerchantRef"
            - type: "null"
        product:
          $ref: "#/components/schemas/Product"
        quantity:
          type: integer
          description: Quantité que vous détenez.
        reorder_threshold:
          type: integer
          description: Seuil de réapprovisionnement.
        updated_at:
          $ref: "#/components/schemas/DateTime"
    StockTransfer:
      type: object
      description: Un transfert de stock du marchand vers votre dépôt.
      required: [id, object, status, merchant, product, quantity, comment, rejection_reason, created_at, validated_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: stock_transfer
        status:
          $ref: "#/components/schemas/StockTransferStatus"
        merchant:
          $ref: "#/components/schemas/MerchantRef"
        product:
          $ref: "#/components/schemas/Product"
        quantity:
          type: integer
        comment:
          type: string
          description: Commentaire du marchand.
        rejection_reason:
          type: string
          description: Votre motif de refus.
        created_at:
          $ref: "#/components/schemas/DateTime"
        validated_at:
          $ref: "#/components/schemas/NullableDateTime"
          description: Date de votre réponse (acceptation ou refus).
        updated_at:
          $ref: "#/components/schemas/DateTime"
    StockReturn:
      type: object
      description: Un retour de stock de votre dépôt vers le marchand.
      required: [id, object, status, merchant, product, quantity, reason, created_at, validated_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: stock_return
        status:
          $ref: "#/components/schemas/StockReturnStatus"
        merchant:
          $ref: "#/components/schemas/MerchantRef"
        product:
          $ref: "#/components/schemas/Product"
        quantity:
          type: integer
        reason:
          type: string
        created_at:
          $ref: "#/components/schemas/DateTime"
        validated_at:
          $ref: "#/components/schemas/NullableDateTime"
          description: Date de la réponse du marchand.
        updated_at:
          $ref: "#/components/schemas/DateTime"

    # ── Webhooks ────────────────────────────────────────────────────────

    WebhookEndpoint:
      type: object
      required: [id, object, url, description, environment, events, enabled, disabled_reason, consecutive_failures, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: webhook_endpoint
        url:
          type: string
          format: uri
        description:
          type: string
        environment:
          $ref: "#/components/schemas/Environment"
        events:
          type: array
          description: Événements reçus ; vide = tous, y compris ceux ajoutés plus tard.
          items:
            $ref: "#/components/schemas/EventType"
        enabled:
          type: boolean
        disabled_reason:
          type: string
          description: |
            Pourquoi le point est désactivé (chaîne vide s'il est actif). Woura
            désactive un point qui échoue 20 fois de suite depuis plus de
            24 heures, et les points créés avec une clé révoquée (« Clé API
            qui l'a créé révoquée. »).
        consecutive_failures:
          type: integer
          description: Échecs d'envoi consécutifs (remis à zéro au premier succès).
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"
    WebhookEndpointWithSecret:
      description: Le point, avec son secret de signature (à la création et à `rotate-secret` seulement).
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: "Secret de signature : `whsec_` puis une chaîne aléatoire."
              example: whsec_Jx8mQ2vL5nR9tW3yB7cE1fH4kP6sU0zA2dG5jM8oQ1r
    WebhookDelivery:
      type: object
      description: |
        Un envoi d'un événement à un point. Réussi si le point répond 2xx en
        moins de 10 secondes ; sinon nouveaux essais, comptés depuis la
        création de l'envoi : 1 min, 6 min, 36 min, 2 h 36, 7 h 36, 17 h 36,
        24 h (huit tentatives en tout), puis abandon (`failed`). Un renvoi est
        un nouvel envoi.

        Une tentative dure au plus 15 secondes : 5 s pour résoudre le nom,
        10 s pour tout l'envoi (seconde adresse comprise).

        Un point qui a échoué 3 fois de suite ne reçoit plus d'envoi immédiat
        des nouveaux événements : ils partent au rattrapage de chaque minute,
        2 au plus par minute pour ce point, jusqu'à son prochain succès.
      required: [id, object, event_id, event_type, endpoint_id, status, attempts, next_attempt_at, last_attempt_at, response_status, error, trigger, created_at, succeeded_at]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de l'envoi (en-tête `Woura-Delivery-Id`).
        object:
          type: string
          const: webhook_delivery
        event_id:
          type: string
          pattern: "^evt_[0-9a-f]{32}$"
        event_type:
          $ref: "#/components/schemas/WebhookEventTypeOrPing"
        endpoint_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
        attempts:
          type: integer
        next_attempt_at:
          $ref: "#/components/schemas/NullableDateTime"
          description: Prochaine tentative, pour un envoi `pending` ou `retrying` ; `null` sinon.
        last_attempt_at:
          $ref: "#/components/schemas/NullableDateTime"
        response_status:
          type: [integer, "null"]
          description: Code HTTP de la dernière réponse du point, `null` sans réponse.
        error:
          type: string
          description: Cause du dernier échec (« Réponse HTTP 500 », redirection non suivie, délai dépassé…), chaîne vide sinon.
        trigger:
          type: string
          enum: [automatic, api_retry, woura_retry]
          description: "`automatic` : envoi d'origine ; `api_retry` : renvoi par l'API ; `woura_retry` : renvoi par l'équipe Woura."
        created_at:
          $ref: "#/components/schemas/DateTime"
        succeeded_at:
          $ref: "#/components/schemas/NullableDateTime"
    WebhookDeliveryDetail:
      allOf:
        - $ref: "#/components/schemas/WebhookDelivery"
        - type: object
          required: [request_body, response_body]
          properties:
            request_body:
              $ref: "#/components/schemas/WebhookEvent"
              description: L'événement envoyé.
            response_body:
              type: string
              description: Début de la réponse du point (1 000 caractères au plus).

    # ── Événements (webhooks) ───────────────────────────────────────────

    WebhookEvent:
      type: object
      description: |
        L'enveloppe de tout événement. Un même événement peut arriver plus
        d'une fois : dédoublonnez sur `id`.
      required: [id, object, type, api_version, environment, occurred_at, data]
      properties:
        id:
          type: string
          pattern: "^evt_[0-9a-f]{32}$"
        object:
          type: string
          const: event
        type:
          $ref: "#/components/schemas/WebhookEventTypeOrPing"
        api_version:
          type: string
          const: "2026-10-22"
        environment:
          $ref: "#/components/schemas/Environment"
        occurred_at:
          $ref: "#/components/schemas/DateTime"
          description: |
            Pour `shipment.assigned`, `shipment.status_changed` et
            `shipment.cancelled`, l'heure du changement au journal de la
            livraison ; pour les autres, l'heure où l'événement a été émis.
        data:
          type: object
          description: Le contenu propre au type.
    ShipmentAssignedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: shipment.assigned
            data:
              type: object
              required: [shipment]
              properties:
                shipment:
                  $ref: "#/components/schemas/Shipment"
    ShipmentStatusChangedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: shipment.status_changed
            data:
              type: object
              required: [shipment, previous_status]
              properties:
                shipment:
                  $ref: "#/components/schemas/Shipment"
                previous_status:
                  type: string
                  description: Statut d'avant, chaîne vide s'il n'y en a pas.
                  enum: ["", assigned, accepted, refused, picked_up, in_transit, delivered, failed, rescheduled, returned, cancelled]
    ShipmentCancelledEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: shipment.cancelled
            data:
              type: object
              required: [shipment]
              properties:
                shipment:
                  $ref: "#/components/schemas/Shipment"
    ShipmentUpdatedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: shipment.updated
            data:
              type: object
              required: [shipment, changed_fields]
              properties:
                shipment:
                  $ref: "#/components/schemas/Shipment"
                changed_fields:
                  type: array
                  description: Champs de la livraison qui ont changé, par ordre alphabétique.
                  items:
                    type: string
                    enum: [cod_amount, currency, customer, delivery_fee, delivery_fee_included, items, merchant, note, order_id, order_number, payment]
    PartnershipEventData:
      type: object
      required: [merchant, changed_fields]
      properties:
        merchant:
          $ref: "#/components/schemas/Merchant"
        changed_fields:
          type: array
          items:
            type: string
            enum: [status, stock_mode, auto_accept, pickup_address]
        previous_status:
          $ref: "#/components/schemas/PartnershipStatus"
          description: Présent seulement quand le statut a changé d'un statut connu à un autre.
    PartnershipRequestedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: partnership.requested
            data:
              $ref: "#/components/schemas/PartnershipEventData"
    PartnershipUpdatedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: partnership.updated
            data:
              $ref: "#/components/schemas/PartnershipEventData"
    MerchantInvitationAcceptedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: merchant_invitation.accepted
            data:
              type: object
              required: [invitation, merchant]
              properties:
                invitation:
                  type: object
                  required: [id, via, accepted_at]
                  properties:
                    id:
                      type: [string, "null"]
                      format: uuid
                      description: L'`id` rendu par `POST /merchant-invitations` ; `null` par le lien.
                    via:
                      type: string
                      enum: [link, contact]
                    accepted_at:
                      $ref: "#/components/schemas/DateTime"
                merchant:
                  $ref: "#/components/schemas/Merchant"
    StockTransferRequestedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: stock_transfer.requested
            data:
              type: object
              required: [stock_transfer]
              properties:
                stock_transfer:
                  $ref: "#/components/schemas/StockTransfer"
    StockTransferUpdatedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: stock_transfer.updated
            data:
              type: object
              required: [stock_transfer, previous_status]
              properties:
                stock_transfer:
                  $ref: "#/components/schemas/StockTransfer"
                previous_status:
                  $ref: "#/components/schemas/StockTransferStatus"
    StockReturnCreatedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: stock_return.created
            data:
              type: object
              required: [stock_return]
              properties:
                stock_return:
                  $ref: "#/components/schemas/StockReturn"
    StockReturnUpdatedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: stock_return.updated
            data:
              type: object
              required: [stock_return, previous_status]
              properties:
                stock_return:
                  $ref: "#/components/schemas/StockReturn"
                previous_status:
                  $ref: "#/components/schemas/StockReturnStatus"
    StatementIssuedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: statement.issued
            data:
              type: object
              required: [statement, previous_status]
              properties:
                statement:
                  $ref: "#/components/schemas/Statement"
                previous_status:
                  $ref: "#/components/schemas/StatementStatus"
    StatementConfirmedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: statement.confirmed
            data:
              type: object
              required: [statement, previous_status]
              properties:
                statement:
                  $ref: "#/components/schemas/Statement"
                previous_status:
                  $ref: "#/components/schemas/StatementStatus"
    StatementDisputedEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: statement.disputed
            data:
              type: object
              required: [statement, previous_status]
              properties:
                statement:
                  $ref: "#/components/schemas/Statement"
                previous_status:
                  $ref: "#/components/schemas/StatementStatus"
    StatementCancelledEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: statement.cancelled
            data:
              type: object
              required: [statement, previous_status]
              properties:
                statement:
                  $ref: "#/components/schemas/Statement"
                previous_status:
                  $ref: "#/components/schemas/StatementStatus"
    PingEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEvent"
        - type: object
          properties:
            type:
              const: ping
            data:
              type: object
              required: [ping]
              properties:
                ping:
                  type: object
                  required: [endpoint_id, message]
                  properties:
                    endpoint_id:
                      type: string
                      format: uuid
                    message:
                      type: string
                      const: Bonjour de Woura.

    # ── Corps de requête ────────────────────────────────────────────────

    EmptyRequest:
      type: object
      description: Aucun champ accepté (un champ envoyé est refusé en `400`). Le corps peut être absent.
      additionalProperties: false
      maxProperties: 0
    StatementCreateRequest:
      type: object
      additionalProperties: false
      required: [merchant_id]
      properties:
        merchant_id:
          type: string
          format: uuid
          description: La boutique (`merchant.id`).
        currency:
          type: string
          maxLength: 3
          description: Obligatoire seulement si vos livraisons à relever pour ce marchand sont en plusieurs devises.
        period_start:
          type: [string, "null"]
          format: date
          description: Par défaut, le jour de la plus ancienne livraison non relevée.
        period_end:
          type: [string, "null"]
          format: date
          description: Par défaut, aujourd'hui (jour du marchand). Jamais dans le futur.
        issue:
          type: boolean
          default: false
          description: "`true` : le relevé est émis aussitôt (le marchand le voit)."
    StatementPaymentRequest:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        paid_at:
          type: [string, "null"]
          format: date-time
          description: Par défaut, maintenant. Jamais dans le futur.
        amount:
          type: [number, "null"]
          minimum: 0
          description: Par défaut, ce qui reste dû (`net_amount − paid_amount`, `0` au moins).
        reference:
          type: string
          maxLength: 100
          default: ""
          description: Votre référence de transaction.
        proof_url:
          type: string
          maxLength: 1000
          description: Lien `http(s)` vers la preuve (reçu, capture).
        note:
          type: string
          maxLength: 1000
          default: ""
    StatementCancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
          default: ""
          description: Obligatoire sauf pour un brouillon ; le marchand le lit.
    TestWeeklyRunRequest:
      type: object
      additionalProperties: false
      properties:
        period_end:
          type: [string, "null"]
          format: date
          description: Dernier jour relevé (aujourd'hui par défaut). Jamais dans le futur.
    TestStatementDisputeRequest:
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
          maxLength: 1000
          description: Le commentaire du marchand fictif.
    PartnershipAcceptRequest:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          maxLength: 1000
          default: ""
          description: Votre réponse au marchand.
    PartnershipRefuseRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
          default: ""
          description: Motif du refus, transmis au marchand.
    MerchantInvitationRequest:
      type: object
      additionalProperties: false
      description: "`email` ou `phone`, l'un des deux exactement (`400` sinon)."
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 30
          pattern: "^\\+[1-9][0-9 ().-]{6,20}$"
          description: Format international, au moins 8 chiffres (`+22997000000`, espaces, points, tirets et parenthèses permis).
      oneOf:
        - required: [email]
        - required: [phone]
    ShipmentUpdateRequest:
      type: object
      additionalProperties: false
      required: [external_reference]
      properties:
        external_reference:
          type: string
          maxLength: 100
          description: Votre référence ; chaîne vide pour l'effacer.
    ShipmentAcceptRequest:
      type: object
      additionalProperties: false
      properties:
        rider_name:
          type: string
          maxLength: 150
          description: Nom du livreur affecté.
        rider_phone:
          type: string
          maxLength: 30
          description: Téléphone du livreur affecté.
    ShipmentRefuseRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Motif du refus, transmis au marchand.
    ShipmentEventRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/DeclarableShipmentStatus"
        reason:
          type: string
          maxLength: 1000
          default: ""
          description: Motif ; obligatoire pour `refused`, `failed`, `rescheduled` et `cancelled`.
        occurred_at:
          type: [string, "null"]
          format: date-time
          description: Quand c'est arrivé chez vous ; l'heure de réception à défaut.
        rider_name:
          type: string
          maxLength: 150
          description: Nom du livreur (chaîne vide pour l'effacer).
        rider_phone:
          type: string
          maxLength: 30
          description: Téléphone du livreur (chaîne vide pour l'effacer).
        photo_url:
          type: string
          format: uri
          maxLength: 1000
          description: URL `http` ou `https` d'une photo (preuve de livraison, par exemple).
        delivery_fee:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
          description: Vos frais réels, avec `delivered` seulement ; ils remplacent les frais de la commande.
        rescheduled_for:
          type: [string, "null"]
          format: date-time
          description: Nouvelle date de passage ; obligatoire avec `rescheduled`, pas dans le passé.
        note:
          type: string
          maxLength: 1000
          description: Note libre ; quand le statut fait changer la commande, elle est ajoutée à la note de la commande (préfixe « [Livreur] »).
        external_reference:
          type: string
          maxLength: 100
          description: Votre référence (chaîne vide pour l'effacer).
    StockTransferRefuseRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
          default: ""
          description: Motif du refus (`rejection_reason`).
    StockReturnCreateRequest:
      type: object
      additionalProperties: false
      required: [merchant_id, product_id, quantity]
      properties:
        merchant_id:
          type: string
          format: uuid
          description: La boutique à qui rendre le stock.
        product_id:
          type: [string, integer]
          pattern: "^[0-9]+$"
          maxLength: 40
          description: Le produit (identifiant de `/stock`, chiffres).
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        reason:
          type: string
          maxLength: 1000
          default: ""
    WebhookEndpointCreateRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          maxLength: 500
          description: URL `https` publique, sans identifiants.
        description:
          type: string
          maxLength: 200
          default: ""
        events:
          type: array
          maxItems: 11
          description: Événements à recevoir ; vide ou absent = tous. `ping` ne s'y met pas.
          items:
            $ref: "#/components/schemas/EventType"
        enabled:
          type: boolean
          default: true
    WebhookEndpointUpdateRequest:
      type: object
      additionalProperties: false
      description: Seuls les champs envoyés changent.
      properties:
        url:
          type: string
          maxLength: 500
          description: URL `https` publique, sans identifiants.
        description:
          type: string
          maxLength: 200
        events:
          type: array
          maxItems: 11
          description: Événements à recevoir ; vide = tous.
          items:
            $ref: "#/components/schemas/EventType"
        enabled:
          type: boolean
          description: "`true` réactive le point et remet son compteur d'échecs à zéro."
    TestShipmentCreateRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/StockMode"
          default: depot
        accept_automatically:
          type: boolean
          default: true
          description: "`true` : la livraison arrive `accepted` ; `false` : `assigned`."
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/TestShipmentItem"
        cod_amount:
          type: integer
          minimum: 0
          maximum: 100000000
          description: |
            Sans `items` seulement : prix de l'article de test unique
            (15 000 par défaut). Ignoré si `items` est donné.
        delivery_fee:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 1500
        delivery_fee_included:
          type: boolean
          default: true
        customer:
          $ref: "#/components/schemas/TestCustomer"
        note:
          type: string
          maxLength: 500
          default: ""
        city:
          type: string
          maxLength: 100
          description: Ville du client (prend le pas sur `customer.city`).
    TestShipmentItem:
      type: object
      description: Un article de la commande de test.
      additionalProperties: false
      required: [name, quantity, unit_price]
      properties:
        name:
          type: string
          maxLength: 200
        sku:
          type: string
          maxLength: 100
          default: ""
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        unit_price:
          type: [number, string]
          minimum: 0
          description: Prix unitaire, deux décimales au plus, 12 chiffres au plus.
    TestCustomer:
      type: object
      description: Le client de la commande de test (valeurs par défaut aussi sans l'objet `customer`).
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          default: Client test
        address:
          type: string
          maxLength: 300
          default: ""
          description: Adresse de livraison (`customer.address` de la livraison).
        city:
          type: string
          maxLength: 100
          default: Cotonou
        country:
          type: string
          maxLength: 2
          default: BJ
    TestShipmentCancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          default: ""
    TestShipmentUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        address:
          type: string
          maxLength: 300
          description: Nouvelle adresse de livraison (`customer.address` de la livraison).
        city:
          type: string
          maxLength: 100
        note:
          type: string
          maxLength: 500
        items_amount:
          type: integer
          minimum: 0
          maximum: 100000000
          description: Nouveau montant des articles (prix négocié) ; change `cod_amount`.
    TestStockTransferCreateRequest:
      type: object
      additionalProperties: false
      properties:
        product_name:
          type: string
          minLength: 1
          maxLength: 200
          default: Produit test
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10
        comment:
          type: string
          maxLength: 500
          default: ""
    TestPartnershipRequestCreateRequest:
      type: object
      additionalProperties: false
      properties:
        merchant_name:
          type: string
          minLength: 1
          maxLength: 100
          default: Marchand de test
        message:
          type: string
          maxLength: 500
          default: ""
