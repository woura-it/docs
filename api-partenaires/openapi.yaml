      description: |
        Refuse la livraison, avec un motif obligatoire. Permis seulement avant
        la prise en charge (depuis `assigned` ou `accepted`) ; une fois le
        colis en main, déclarez `cancelled` ou `returned` (route `events`).

        La livraison passe `refused` et est close (`active: false`). La
        commande revient au marchand sans livreur, son statut inchangé, et le
        marchand est prévenu (notification dans l'application et push). Toute
        déclaration suivante sur cette livraison répond `409 shipment_closed`.
      parameters:
