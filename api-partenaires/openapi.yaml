    post:
      operationId: rotateWebhookEndpointSecret
      tags: [Webhooks]
      summary: Changer le secret d'un point
      description: |
        Génère un nouveau secret et le rend (seule autre fois où il est
        montré). L'ancien ne signe plus rien dès cette réponse : chaque
        tentative d'envoi est signée avec le secret en vigueur. Corps vide.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
      responses:
        "200":
          description: Le point, avec son nouveau secret.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
