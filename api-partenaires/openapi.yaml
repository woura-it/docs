  /shipments/{shipment_id}/events:
    parameters:
      - $ref: "#/components/parameters/ShipmentId"
    post:
      operationId: createShipmentEvent
      tags: [Livraisons]
      summary: Déclarer un statut
      description: |
        Déclare un statut (ou une mise à jour) de la livraison. Le statut est
        vérifié, écrit au journal (`actor: api`), puis la commande du marchand
        suit :

        | `status` | Commande du marchand |
        |---|---|
        | `accepted` | inchangée |
        | `refused` | revient sans livreur (voir `POST /shipments/{id}/refuse`) |
        | `picked_up` | en livraison |
        | `in_transit` | en livraison |
        | `delivered` | livrée |
        | `failed` | injoignable |
        | `rescheduled` | programmée à `rescheduled_for` |
        | `returned` | retournée |
        | `cancelled` | annulée |

        **Passages permis** (sinon `409 transition_not_allowed`) :

        | Depuis | Vers |
        |---|---|
        | `assigned`, `accepted` | `accepted`, `refused`, `picked_up`, `in_transit`, `delivered`, `failed`, `rescheduled`, `cancelled` |
        | `picked_up` | `picked_up`, `in_transit`, `delivered`, `failed`, `rescheduled`, `returned`, `cancelled` |
        | `in_transit` | `in_transit`, `delivered`, `failed`, `rescheduled`, `returned`, `cancelled` |
        | `failed` | `failed`, `in_transit`, `delivered`, `rescheduled`, `returned`, `cancelled` |
        | `rescheduled` | `rescheduled`, `picked_up`, `in_transit`, `delivered`, `failed`, `returned`, `cancelled` |
        | `delivered`, `refused`, `returned`, `cancelled` | aucun (statuts finaux) |

        Renvoyer le statut actuel est une mise à jour (livreur, nouvelle date
        de report, nouvel échec avec un autre motif). Sans rien de neuf, rien
        n'est écrit et la réponse est `200` au lieu de `201` ; de même pour
        `delivered`, `returned` ou `cancelled` renvoyé sur une livraison qui a
        déjà ce statut, ou pour une `Idempotency-Key` déjà vue au journal de
        cette livraison.

        **Règles** (sinon `400 validation_error`, `details` par champ) :
        - `reason` est obligatoire pour `refused`, `failed`, `rescheduled` et
          `cancelled` ;
        - `rescheduled_for` est obligatoire pour `rescheduled`, et ne doit pas
          être passée (tolérance de 5 minutes) ; il est ignoré pour les
          autres statuts ;
        - `delivery_fee` (vos frais réels) ne s'envoie qu'avec `delivered` ;
          il remplace les frais de livraison de la commande ;
        - `picked_up` n'existe qu'en mode `pickup` ;
        - en mode `depot` (hors bac à sable), partir en livraison
          (`in_transit`) exige que votre stock couvre les articles (`400`,
          « Stock insuffisant chez le livreur… »).

        Une livraison close (`active: false`) répond `409 shipment_closed`.
        En cas de refus, rien n'est écrit, ni sur la livraison ni sur la
        commande.

        Ce que vous déclarez ici ne vous est pas renvoyé par webhook.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentEventRequest"
            examples:
              en_route:
                summary: En route, avec le livreur
                value:
                  status: in_transit
                  rider_name: Ibrahim Sanni
                  rider_phone: "+22990000000"
              livree:
                summary: Livrée, avec les frais réels et la preuve
                value:
                  status: delivered
                  delivery_fee: 2000
                  photo_url: https://cdn.livraisons-express.example/pod/EXP-2026-000123.jpg
                  occurred_at: "2026-10-22T15:42:10+01:00"
              echec:
                summary: Échec
                value:
                  status: failed
                  reason: Client injoignable, trois appels sans réponse
              report:
                summary: Report
                value:
                  status: rescheduled
                  reason: Le client demande un passage demain matin
                  rescheduled_for: "2026-10-23T09:00:00+01:00"
              annulee:
                summary: Annulée (le client refuse le colis)
                value:
                  status: cancelled
                  reason: Le client refuse le colis à la porte
      responses:
        "201":
          description: Statut écrit ; la livraison à jour.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
              example:
                id: 6f1c2a8e-3b9e-4c55-9a51-2d0f8f7b1e40
                object: shipment
                status: delivered
                mode: pickup
                active: true
                order_id: "393093856815339"
                order_number: "#0412"
                merchant:
                  id: b4b6e0d2-5c3a-4f8e-a1d7-2c9e6f0b8a45
                  name: Boutique Awa
                  phone: "+22997000000"
                  country: BJ
                  pickup_address: Marché Dantokpa, allée 4, Cotonou
                customer:
                  name: Koffi Mensah
                  phone: "+22996000000"
                  address: Fidjrossè, rue 12
                  city: Cotonou
                  country: BJ
                  details: Portail bleu après la pharmacie
                items:
                  - name: Robe wax
                    variant: Taille M
                    sku: RW-38
                    quantity: 2
                    unit_price: 7500
                    product_id: "771204958321467"
                cod_amount: 15000
                delivery_fee: 2000
                delivery_fee_included: true
                currency: XOF
                payment:
                  status: unpaid
                  paid_amount: 0
                note: Appeler avant de passer
                external_reference: EXP-2026-000123
